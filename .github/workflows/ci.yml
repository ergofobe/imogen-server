name: CI

on:
  push:
    branches: [main]
    # A version tag is what publishes a released image; main publishes :latest.
    tags: ['v*']
  pull_request:
  # So a maintainer can re-run the suite without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three jobs below name the image. A registry path copied around is a registry path that
# goes stale in one of the copies.
env:
  IMAGE: ghcr.io/ergofobe/imogen-server

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Tests run against a real Postgres. The behaviour worth testing lives in unique
      # indexes, transactional guards, and the generated search vector, none of which a
      # mocked store would exercise.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: imogen
          POSTGRES_PASSWORD: imogen
          POSTGRES_DB: imogen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imogen -d imogen"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      TEST_DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      NODE_ENV: test

    steps:
      # The client libraries are a submodule, so the commit being tested names the SDK
      # commit to test it against. Re-running an old commit reproduces what it was
      # originally green against rather than building against today's SDK.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # ffmpeg decodes RAW and video; libheif handles HEIC, which ffmpeg mis-decodes when
      # the image is tiled. exiftool and heif-enc build the fixtures the media tests need,
      # so HEIC and EXIF are genuinely exercised here rather than skipped. Encoding a HEIC
      # additionally needs the x265 plugin — without it heif-enc reports "No HEVC encoder
      # available" and the fixtures silently do not appear. Decoding, which is all the
      # application itself does, needs no plugin.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libheif-examples libimage-exiftool-perl \
            libheif-plugin-x265 libheif-plugin-libde265

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Test
        run: bun test

      - name: Build the web bundle
        run: bun run --filter '@imogen/web' build

  # Each platform builds on a runner of its own architecture rather than one runner
  # cross-building the other under QEMU. The runtime stage installs ffmpeg and libheif from
  # apt, and emulating that install costs more than the entire rest of the build;
  # ubuntu-24.04-arm is free for public repositories, so the two halves run side by side and
  # wall-clock barely moves.
  #
  # Neither half publishes a tag. Each pushes an untagged manifest addressed only by its
  # digest, and the merge job assembles those into the one multi-platform tag people pull.
  # Pushing a tag from both halves would not produce a manifest list at all — the second
  # push would simply replace the first, which is how every image so far ended up amd64
  # only.
  docker:
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      # `linux/amd64` is not a legal artifact name or cache scope; `linux-amd64` is.
      - name: Name this platform
        env:
          PLATFORM_SLASHED: ${{ matrix.platform }}
        run: echo "PLATFORM=${PLATFORM_SLASHED//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3

      # A pull request still builds both platforms, to prove the Dockerfile works on each,
      # but does not sign in or push: a fork's token cannot write to the registry, and an
      # unreviewed branch has no business publishing an image people can pull.
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags are worked out once, in the merge job, and applied to the manifest
      # list rather than to either half of it.
      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scoped per platform. A single shared scope would have each build evict the
          # other's layers on every run, so neither would ever start from a warm cache.
          cache-from: type=gha,scope=${{ env.PLATFORM }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM }}

      # The digest is the entire payload. An empty file named after it carries everything
      # the merge job needs to rebuild the reference.
      - name: Hand the digest to the merge job
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags are created here and nowhere else, so `:latest` and `:0.4` name a manifest list
  # covering both platforms rather than whichever build happened to finish last.
  merge:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags carry no leading v, so a compose file pins `imogen-server:0.1.0`
      # rather than `:v0.1.0`. main additionally moves :latest and publishes a
      # short-sha tag, so an unreleased commit is still deployable by digest.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}

      - name: Assemble the manifest list
        working-directory: /tmp/digests
        run: |
          # Assembled as an array rather than interpolated into one string: splitting a
          # command line on whitespace is a bug waiting for the first tag that contains any.
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      # Cheap, and it is the whole point of the change: a run that manages to publish one
      # platform should fail here rather than ship an image that quietly emulates.
      - name: Check both platforms made it in
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            | jq -e '[.manifests[].platform | select(.os != "unknown")
                      | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]'
