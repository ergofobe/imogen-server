name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a maintainer can re-run the suite without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Tests run against a real Postgres. The behaviour worth testing lives in unique
      # indexes, transactional guards, and the generated search vector, none of which a
      # mocked store would exercise.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: imogen
          POSTGRES_PASSWORD: imogen
          POSTGRES_DB: imogen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imogen -d imogen"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      TEST_DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      NODE_ENV: test

    defaults:
      run:
        working-directory: imogen-server

    steps:
      - uses: actions/checkout@v5
        with:
          path: imogen-server

      # The client libraries are a sibling checkout until they are published. The
      # `overrides` block in package.json resolves them from ../imogen-sdk, so the two
      # repositories have to sit next to each other here as they do on a workstation.
      - uses: actions/checkout@v5
        with:
          repository: ergofobe/imogen-sdk
          path: imogen-sdk

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # ffmpeg decodes RAW and video; libheif handles HEIC, which ffmpeg mis-decodes when
      # the image is tiled. exiftool and heif-enc build the fixtures the media tests need,
      # so HEIC and EXIF are genuinely exercised here rather than skipped. Encoding a HEIC
      # additionally needs the x265 plugin — without it heif-enc reports "No HEVC encoder
      # available" and the fixtures silently do not appear. Decoding, which is all the
      # application itself does, needs no plugin.
      - name: Install media tools
        # Nothing repository-relative here, so it runs wherever it likes.
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libheif-examples libimage-exiftool-perl \
            libheif-plugin-x265 libheif-plugin-libde265

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Test
        run: bun test

      - name: Build the web bundle
        run: bun run --filter '@imogen/web' build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          path: imogen-server
      - uses: actions/checkout@v5
        with:
          repository: ergofobe/imogen-sdk
          path: imogen-sdk
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The context holds both repositories: the client packages come from the
          # sibling checkout, and a build context cannot reach outside itself.
          context: .
          file: imogen-server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
